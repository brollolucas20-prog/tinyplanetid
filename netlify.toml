# Configuração para publicar via Git (GitHub/GitLab) no Netlify.
# Para publicar arrastando o .zip em https://app.netlify.com/drop este arquivo não é necessário.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Arquivos com hash no nome podem ficar em cache por 1 ano.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Qualquer rota desconhecida volta para o jogo.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
